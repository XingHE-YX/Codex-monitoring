[package]
name = "codex-reset-watch"
version = "1.0.0"
edition = "2024"

[dependencies]
anyhow = "=1.0.98"
argon2 = "=0.5.3"
axum = "=0.8.4"
base64 = "=0.22.1"
chrono = { version = "=0.4.41", features = ["serde"] }
chrono-tz = "=0.10.4"
clap = { version = "=4.5.45", features = ["derive"] }
dotenvy = "=0.15.7"
governor = "=0.8.1"
jsonwebtoken = { version = "=9.3.1", default-features = false, features = ["use_pem"] }
lettre = { version = "=0.11.17", default-features = false, features = ["tokio1-rustls-tls", "builder"] }
rand = "=0.9.2"
regex = "=1.11.1"
reqwest = { version = "=0.12.23", default-features = false, features = ["rustls-tls", "json", "gzip", "brotli", "deflate"] }
scraper = "=0.23.1"
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.142"
sha2 = "=0.10.9"
sqlx = { version = "=0.8.6", default-features = false, features = ["sqlite", "runtime-tokio-rustls", "macros", "migrate", "chrono", "uuid"] }
thiserror = "=2.0.12"
tokio = { version = "=1.47.1", features = ["macros", "rt-multi-thread"] }
tower-http = "=0.6.6"
tracing = "=0.1.41"
tracing-subscriber = "=0.3.19"
url = "=2.5.4"
uuid = { version = "=1.17.0", features = ["serde", "v4"] }
zeroize = "=1.8.1"

[dev-dependencies]
proptest = "=1.7.0"
wiremock = "=0.6.5"
